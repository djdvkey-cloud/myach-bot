name: Myach Bot

on:
  schedule:
    # Каждый день с 08:00 до 00:00 по Екатеринбургу каждые 10 минут
    # 08:00–23:50 Екб = 03:00–18:50 UTC
    - cron: '*/10 3-18 * * *'
    # Суббота 12:00 Екб = 07:00 UTC (дополнительный запуск для опроса)
    - cron: '0 7 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python myach-bot-fixed.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update bot data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
