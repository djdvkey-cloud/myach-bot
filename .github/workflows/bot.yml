name: Myach Bot

on:
  # Бот перенесён на постоянный хостинг Amvera (см. README) — расписание
  # здесь ОТКЛЮЧЕНО намеренно. Если оставить активным, GitHub Actions и
  # Amvera будут одновременно читать одни и те же сообщения Telegram
  # через bot.get_updates(offset=...), каждый со своим файлом offset —
  # это гонка, которая ломает доставку сообщений и опросов.
  # На случай отладки/разового ручного прогона отсюда — workflow_dispatch
  # оставлен, schedule-триггеры убраны.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update bot data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
